<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://at.alicdn.com" crossorigin />
    <!-- 更新图标: pnpm sync:icon "<新CSS URL>" — 勿手动改此行,脚本会覆写 -->
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4644876_k24gvyy3q1.css" />
    <title>Aurora UX - 轻盈如极光的 React 组件库</title>
    <meta
      name="description"
      content="极光感的 React 组件库 — 60+ 组件 + 可视化看板搭建器, 支持深色模式与主题定制, 纯 CSS 动效, TypeScript 完整类型。"
    />
    <meta name="keywords" content="react,ui,组件库,中后台,看板,dashboard,page-builder,typescript,aurora-ux" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="author" content="yuxianshengS" />
    <link rel="canonical" href="https://yuxianshengs.github.io/aurora-ux/" />

    <!-- Open Graph (Facebook / LinkedIn / 微信 / Slack / Discord) -->
    <meta property="og:site_name" content="Aurora UX" />
    <meta property="og:title" content="Aurora UX - 极光质感 React 组件库" />
    <meta
      property="og:description"
      content="60+ 组件 + 可视化拖拽搭建器, 中后台与数据看板专精, TypeScript 完整类型, 0 运行时依赖。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yuxianshengs.github.io/aurora-ux/" />
    <meta property="og:image" content="https://yuxianshengs.github.io/aurora-ux/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card (大图样式, 比 summary 占位更醒目) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurora UX - 极光质感 React 组件库" />
    <meta
      name="twitter:description"
      content="60+ 组件 + 可视化拖拽搭建器, 中后台与数据看板专精, TypeScript 完整类型。"
    />
    <meta name="twitter:image" content="https://yuxianshengs.github.io/aurora-ux/og-image.svg" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aurora-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
