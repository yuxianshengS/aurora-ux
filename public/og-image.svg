<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 极光渐变文字 -->
    <linearGradient id="auroraText" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- 品牌色块标记 -->
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def" />
      <stop offset="50%" stop-color="#9d6fea" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- 背景径向极光 — 左上青 + 右下紫 -->
    <radialGradient id="auroraCyan" cx="0.18" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.55)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0)" />
    </radialGradient>
    <radialGradient id="auroraPurple" cx="0.82" cy="0.78" r="0.58">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.55)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)" />
    </radialGradient>
    <radialGradient id="auroraPink" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(244, 114, 182, 0.18)" />
      <stop offset="100%" stop-color="rgba(244, 114, 182, 0)" />
    </radialGradient>

    <!-- 网格 pattern -->
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>

    <!-- 网格 mask: 中心椭圆里清晰, 边缘渐隐 -->
    <radialGradient id="gridMask" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="white" stop-opacity="1" />
      <stop offset="55%" stop-color="white" stop-opacity="0.55" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMaskApply">
      <rect width="1200" height="630" fill="url(#gridMask)" />
    </mask>
  </defs>

  <!-- 底色 -->
  <rect width="1200" height="630" fill="#0a0c12" />

  <!-- 网格 (mask 渐隐到边缘) -->
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMaskApply)" />

  <!-- 极光发光 blob -->
  <rect width="1200" height="630" fill="url(#auroraCyan)" />
  <rect width="1200" height="630" fill="url(#auroraPurple)" />
  <rect width="1200" height="630" fill="url(#auroraPink)" />

  <!-- 顶部品牌行: mark + Aurora UX 小字 + 版本 pill -->
  <g transform="translate(72, 78)">
    <rect width="36" height="36" rx="9" fill="url(#markGrad)" />
    <text x="50" y="25"
          font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
          font-size="22" font-weight="700" fill="#fff" letter-spacing="-0.01em">
      Aurora UX
    </text>
    <g transform="translate(196, 6)">
      <rect width="68" height="24" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.18)" />
      <text x="34" y="16"
            font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="12" font-weight="500" fill="rgba(255,255,255,0.78)" text-anchor="middle">
        v0.8.1
      </text>
    </g>
  </g>

  <!-- 主标题 — 极光渐变大字 -->
  <g transform="translate(72, 230)">
    <text font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
          font-size="116" font-weight="900" fill="url(#auroraText)" letter-spacing="-0.04em">
      <tspan x="0" y="0">极光质感</tspan>
      <tspan x="0" y="120">React 组件库</tspan>
    </text>
  </g>

  <!-- 副标题: 简短卖点 -->
  <text x="72" y="500"
        font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
        font-size="26" font-weight="500" fill="rgba(255,255,255,0.86)" letter-spacing="-0.005em">
    60+ 组件 · 数据看板专精 · 拖拽搭建器
  </text>

  <!-- 底部小字: 三个标签 -->
  <g transform="translate(72, 558)">
    <g>
      <rect width="172" height="36" rx="999" fill="rgba(34, 211, 238, 0.14)" stroke="rgba(34, 211, 238, 0.4)" />
      <text x="86" y="23"
            font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
            font-size="14" font-weight="600" fill="#7dd3fc" text-anchor="middle">
        TypeScript 全套类型
      </text>
    </g>
    <g transform="translate(184, 0)">
      <rect width="142" height="36" rx="999" fill="rgba(168, 85, 247, 0.14)" stroke="rgba(168, 85, 247, 0.4)" />
      <text x="71" y="23"
            font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
            font-size="14" font-weight="600" fill="#d8b4fe" text-anchor="middle">
        0 运行时依赖
      </text>
    </g>
    <g transform="translate(338, 0)">
      <rect width="100" height="36" rx="999" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(16, 185, 129, 0.4)" />
      <text x="50" y="23"
            font-family="-apple-system, 'PingFang SC', 'Segoe UI', Helvetica, sans-serif"
            font-size="14" font-weight="600" fill="#6ee7b7" text-anchor="middle">
        MIT 协议
      </text>
    </g>
  </g>

  <!-- 右下: 域名 -->
  <text x="1128" y="588"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="14" fill="rgba(255,255,255,0.45)" text-anchor="end">
    yuxianshengs.github.io/aurora-ux
  </text>
</svg>
